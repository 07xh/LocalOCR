[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localocr-lab"
version = "0.2.0"
description = "Offline-capable local image OCR and authenticated loopback HTTP API"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1", "Pillow>=10,<13", "pydantic>=2.4,<3"]

[project.optional-dependencies]
rapid = ["rapidocr>=3.9,<4", "onnxruntime>=1.17", "numpy>=1.24"]
tesseract = ["pytesseract>=0.3.10"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
localocr = "localocr.cli:main"

[tool.setuptools.packages.find]
include = ["localocr*"]

[tool.setuptools.package-data]
localocr = ["web/*.html", "web/*.js", "web/*.css"]
